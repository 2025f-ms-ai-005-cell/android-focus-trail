<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#0c1827"/><g font-family="Arial,sans-serif" fill="#edf5ff"><text x="90" y="120" font-size="64" font-weight="bold">FocusTrail</text><text x="90" y="185" font-size="30" fill="#a0b7cb">Native Android • foreground study sessions • local history</text><rect x="90" y="270" width="430" height="430" rx="32" fill="#19334b"/><text x="130" y="345" font-size="28">01 / PLAN</text><text x="130" y="435" font-size="42">Choose a topic</text><text x="130" y="505" font-size="28">1–180 minutes</text><text x="130" y="610" font-size="24" fill="#6ce1bd">Validated input</text><rect x="585" y="270" width="430" height="430" rx="32" fill="#19334b"/><text x="625" y="345" font-size="28">02 / FOCUS</text><text x="625" y="435" font-size="42">Start · Pause</text><text x="625" y="505" font-size="28">Resume or end</text><text x="625" y="610" font-size="24" fill="#6ce1bd">Backgrounding pauses</text><rect x="1080" y="270" width="430" height="430" rx="32" fill="#19334b"/><text x="1120" y="345" font-size="28">03 / REVIEW</text><text x="1120" y="435" font-size="42">Session history</text><text x="1120" y="505" font-size="28">Daily progress</text><text x="1120" y="610" font-size="24" fill="#6ce1bd">On-device persistence</text><text x="90" y="810" font-size="30">A deliberate study workflow — no accounts, cloud sync or background alarms.</text><text x="90" y="915" font-size="24" fill="#a0b7cb">Original workflow illustration • not a device screenshot • device execution pending</text></g></svg>
